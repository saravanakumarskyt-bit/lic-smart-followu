name: Build Android APK
on:
  workflow_dispatch:
  push: { tags: ["v*"] }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run privacy-check
      - run: npm run vendor:ocr
      - run: npm run sw:update
      - run: npm run android:add
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: lic-smart-followup-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
