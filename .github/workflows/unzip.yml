name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir tmp
          unzip -q *.zip -d tmp
          rsync -a --exclude '.github' tmp/lic-smart-followup/ ./
          rm -rf tmp *.zip
          git config user.name "unzip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
